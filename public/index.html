<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="DIALED"/>
<link rel="manifest" href="/manifest.json"/>
<title>DIALED — FL Offshore Fishing Chart</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0a0a0a;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;color:#ddd;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* HEADER */
#hdr{background:#0a3d6b;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid #1a5a9a;display:flex;align-items:center;gap:10px;flex-shrink:0}
#hdr-logo{color:#e8c840;font-size:15px;font-weight:800;letter-spacing:1px}
#go-badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.5px;transition:all .3s}
.go-GO{background:#1a3a1a;color:#44ff88;border:1px solid #2a5a2a}
.go-CAUTION{background:#3a2a00;color:#ffcc00;border:1px solid #5a4a00}
.go-NO-GO{background:#3a0a0a;color:#ff4444;border:1px solid #5a1a1a}
.go-loading{background:#1a1a1a;color:#555;border:1px solid #222}
#hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
#hdr-date{font-size:10px;color:#555;font-family:monospace}
.hbtn{width:30px;height:30px;border-radius:8px;border:1px solid #222;background:#111;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}

/* FORECAST TABS */
#ftabs{display:flex;background:#080808;border-bottom:1px solid #1a1a1a;flex-shrink:0}
.ft{flex:1;padding:6px 2px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;color:#cde;border-bottom:2px solid transparent;transition:all .15s}
.ft.on{color:#e8c840;border-bottom-color:#e8c840}
.ft small{display:block;font-size:9px;color:#9bc;margin-top:1px}
.ft.on small{color:#ffe}

/* MAP */
#mapwrap{flex:1;position:relative;overflow:hidden;min-height:0;background:#071525;touch-action:none}
#map{width:100%;height:100%}

/* FLOATING CONTROLS */
#fab-tl{position:fixed;top:120px;left:8px;z-index:1000;display:flex;flex-direction:column;gap:5px}
#fab-tr{position:absolute;top:8px;right:8px;z-index:10;display:flex;flex-direction:column;gap:5px}
.fab{width:36px;height:36px;border-radius:10px;border:1px solid #333;background:rgba(8,8,8,.9);color:#bbb;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;backdrop-filter:blur(3px)}
.fab:active{transform:scale(.95)}
.fab.on{background:rgba(20,40,10,.9);border-color:#3a5a1a;color:#e8c840}
#zoom-lbl{text-align:center;font-size:8px;color:#333;font-family:monospace}

/* LAYER PANEL */
#lyrpanel{position:fixed;top:50px;left:8px;z-index:1000;background:rgba(8,8,8,.96);border:1px solid #2a2a2a;border-radius:10px;padding:8px 10px;display:none;min-width:148px}
#lyrpanel.show{display:block}
.lrow{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #111;font-size:11px;color:#777;gap:8px}
.lrow:last-child{border-bottom:none}
.tog{width:30px;height:15px;border-radius:8px;background:#1a1a1a;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:#c8a020}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on::after{left:17px}

/* SST COLOR BAR */
#sstbar{position:absolute;bottom:8px;left:8px;z-index:10;background:rgba(0,0,0,.78);border-radius:5px;padding:4px 7px;pointer-events:none}
#sst-canvas{border-radius:2px;display:block}
#sst-labels{display:flex;justify-content:space-between;font-size:7px;color:#888;font-family:monospace;margin-top:2px;width:160px}

/* COORDS */
#coords{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.88);border:1px solid #444;border-radius:6px;padding:4px 12px;font-size:12px;font-family:monospace;color:#e8c840;pointer-events:none;white-space:nowrap;font-weight:600;letter-spacing:.3px}

/* STATUS TOAST */
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,.88);border:1px solid #333;border-radius:8px;padding:10px 18px;font-size:12px;color:#ccc;display:none;text-align:center}
#toast.show{display:block}

/* WAYPOINT POPUP */
#wptpop{position:absolute;left:8px;right:8px;bottom:8px;z-index:20;display:none}
.wptinner{background:#0d0d0d;border:2px solid #e8c840;border-radius:12px;padding:11px 13px;position:relative}
.wpth{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wptltr{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#000;flex-shrink:0}
.wpttitle{flex:1}
.wptsp{font-size:11px;font-weight:700;color:#ddd}
.wptco{font-size:10px;color:#aaa;font-family:monospace;margin-top:2px;letter-spacing:.3px}
.wptpct{font-size:20px;font-weight:700}
.wr{display:flex;align-items:center;gap:6px;font-size:11px;color:#777;margin-bottom:3px}
.wbdg{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:auto}
.bi{background:#1a3a1a;color:#44ff88}.bg2{background:#2a2a0a;color:#aacc44}
.bo{background:#2a1a0a;color:#cc8844}.bp{background:#2a0a0a;color:#cc4444}
.wclose{position:absolute;top:-8px;right:8px;width:26px;height:26px;border-radius:50%;background:#333;border:none;color:#fff;font-size:12px;cursor:pointer}

/* BOTTOM SHEET */
#bs{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#0d0d0d;border-top:2px solid #333;border-radius:14px 14px 0 0;transition:transform .28s cubic-bezier(.32,.72,0,1);padding-bottom:max(6px,env(safe-area-inset-bottom))}
#bs.shut{transform:translateY(calc(100% - 50px))}
@media(max-width:640px){
  #bs-cont{max-height:55vh;overflow-y:auto}
  #spgrid{grid-template-columns:repeat(3,1fr);gap:6px}
  .spbtn{padding:8px 4px}
  .spico{font-size:22px}
  .spnm{font-size:9px}
  #fab-tr{gap:6px}
  .fab{width:40px;height:40px;font-size:16px}
  #sstbar{display:none} /* hide on small screens, show in sheet instead */
  #coords{font-size:9px;padding:2px 6px}
  .scard{padding:10px 12px;margin-bottom:8px}
  .scnm{font-size:12px}
  .scco{font-size:10px}
  .scpct{font-size:19px}
  .buoy-val{font-size:14px}
  #go-title{font-size:20px}
}
#bs-hdl{padding:8px 12px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
#bs-bar{width:34px;height:4px;background:#2a2a2a;border-radius:2px}
#bs-tabs{display:flex;gap:5px;padding:4px 8px 5px}
.bst{flex:1;padding:5px 3px;border-radius:7px;border:1px solid #333;background:#1a1a1a;color:#888;cursor:pointer;font-size:10px;font-weight:600;text-align:center;transition:all .15s}
.bst.on{background:#1e2e0e;color:#f0d050;border-color:#4a6a1a;font-weight:700}
#bs-cont{overflow-y:auto;padding:0 8px 8px;max-height:45vh}

/* CONDITIONS PANEL */
#condpanel{display:none}
#gobox{border-radius:10px;padding:12px 14px;margin-bottom:10px;text-align:center}
#go-title{font-size:18px;font-weight:800;letter-spacing:1px;margin-bottom:4px}
#go-sub{font-size:10px;opacity:.8;margin-bottom:8px}
#go-issues{font-size:10px;line-height:1.7;opacity:.85}
.gobox-GO{background:#0a1f0a;border:1px solid #2a5a2a}
.gobox-CAUTION{background:#1f1500;border:1px solid #5a4a00}
.gobox-NO-GO{background:#1f0505;border:1px solid #5a1a1a}
#buoys-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.buoy-card{background:#111;border:1px solid #1a1a1a;border-radius:8px;padding:8px 10px}
.buoy-name{font-size:11px;font-weight:700;color:#ccc;margin-bottom:4px}
.buoy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.buoy-stat{text-align:center}
.buoy-val{font-size:13px;font-weight:700;color:#ddd}
.buoy-lbl{font-size:8px;color:#555;text-transform:uppercase;letter-spacing:.3px}
.buoy-time{font-size:9px;color:#444;margin-top:3px;text-align:right}
#forecast-list{display:flex;flex-direction:column;gap:6px}
.fcast-card{background:#111;border:1px solid #1a1a1a;border-radius:8px;padding:8px 10px}
.fcast-zone{font-size:10px;font-weight:700;color:#888;margin-bottom:4px}
.fcast-period{font-size:10px;color:#777;line-height:1.5;margin-bottom:3px;padding-bottom:3px;border-bottom:1px solid #111}
.fcast-period:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.fcast-name{font-weight:700;color:#ccc;margin-right:6px}

/* SPECIES GRID */
#sppanel{display:none}
#spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:2px 0 6px}
.spbtn{padding:7px 3px;border-radius:8px;border:1px solid #1e1e1e;background:#111;cursor:pointer;text-align:center;transition:all .15s}
.spbtn:active{transform:scale(.97)}
.spbtn.on{border-color:var(--fc);background:var(--fca)}
.spico{font-size:20px;display:block;margin-bottom:2px}
.spnm{font-size:9px;font-weight:600;color:#555;line-height:1.2}
.spbtn.on .spnm{color:#fff}
#sptip{font-size:10px;color:#444;padding:2px 0 6px;line-height:1.5}

/* SPOTS */
#spotpanel{display:none}
.scard{background:#111;border:1px solid #1e1e1e;border-radius:9px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
.scard:active{transform:scale(.99)}
.sctop{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.scltr{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#000;flex-shrink:0}
.scnm{font-size:11px;font-weight:700;color:#ddd}
.scco{font-size:10px;color:#888;font-family:monospace;margin-top:2px}
.scpct{font-size:17px;font-weight:700;margin-left:auto}
.sreas{display:flex;flex-direction:column;gap:3px}
.srea{display:flex;align-items:center;gap:5px;font-size:10px;color:#666}
.srlt{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:auto}

/* LUNAR */
#lunarpanel{display:none;gap:8px;flex-wrap:wrap;padding:4px 0}
.lbox{flex:1;min-width:120px;background:#111;border:1px solid #1e1e1e;border-radius:9px;padding:9px 10px}
.ltit{font-size:9px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.lbig{font-size:22px;margin-bottom:2px}
.lval{font-size:12px;font-weight:700;color:#ccc}
.lsub{font-size:9px;color:#444;margin-top:1px}
.lbar{height:4px;background:#111;border-radius:2px;margin-top:5px}
.lfill{height:4px;border-radius:2px}
</style>
</head>
<body>
<div id="app">

<!-- Header -->
<div id="hdr">
  <div id="hdr-logo">DIALED IN FISHING</div>
  <div id="go-badge" class="go-loading">LOADING...</div>
  <div id="hdr-right">
    <input type="date" id="datein" style="font-size:10px;padding:2px 4px;border:1px solid #333;border-radius:5px;background:#111;color:#ccc"/>
    <button class="hbtn" onclick="applyDate()" title="Update">↻</button>
    <button class="hbtn" onclick="doGPS()" title="My location" id="gps-btn">◎</button>
  </div>
</div>

<!-- Forecast tabs -->
<div id="ftabs">
  <div class="ft on" id="ft-0" onclick="setDay(0)">TODAY<small id="fd-0"></small></div>
  <div class="ft"    id="ft-1" onclick="setDay(1)">+1<small id="fd-1"></small></div>
  <div class="ft"    id="ft-2" onclick="setDay(2)">+2<small id="fd-2"></small></div>
  <div class="ft"    id="ft-3" onclick="setDay(3)">+3<small id="fd-3"></small></div>
  <div class="ft"    id="ft-4" onclick="setDay(4)">+4<small id="fd-4"></small></div>
</div>

<!-- Map -->
<div id="mapwrap">
  <div id="map"></div>

  <!-- Layer FAB -->
  <div id="fab-tl">
    <button class="fab on" onclick="toggleLyr(event)">⚙</button>
  </div>

  <!-- Layer panel -->
  <div id="lyrpanel">
    <div class="lrow"><span>SST Isotherms</span><button class="tog on" id="t-iso" onclick="tog('iso')"></button></div>
    <div class="lrow"><span>Temp Breaks</span><button class="tog on" id="t-brk" onclick="tog('brk')"></button></div>
    <div class="lrow"><span>Chlorophyll</span><button class="tog on" id="t-chl" onclick="tog('chl')"></button></div>
  </div>

  <!-- Zoom -->
  <div id="fab-tr">
    <button class="fab" onclick="toggleSheet()" title="Show conditions" style="font-size:11px">📋</button>
    <button class="fab" onclick="zoomIn()">+</button>
    <button class="fab" onclick="zoomOut()">−</button>
    <button class="fab" style="font-size:11px" onclick="zoomReset()">⌂</button>
    <div id="zoom-lbl">z7</div>
  </div>

  <!-- SST color bar -->
  <div id="sstbar">
    <canvas id="sst-canvas" width="160" height="10"></canvas>
    <div id="sst-labels"></div>
  </div>

  <!-- Coordinates -->
  <div id="coords">Tap map for conditions</div>

  <!-- Status toast -->
  <div id="toast"></div>

  <!-- Waypoint popup -->
  <div id="wptpop">
    <div class="wptinner" id="wptinner">
      <button class="wclose" onclick="closeWpt()">✕</button>
      <div class="wpth">
        <div class="wptltr" id="wptltr"></div>
        <div class="wpttitle">
          <div class="wptsp" id="wptsp"></div>
          <div class="wptco" id="wptco"></div>
        </div>
        <div class="wptpct" id="wptpct"></div>
      </div>
      <hr style="border:none;border-top:1px solid #1a1a1a;margin:6px 0"/>
      <div id="wptreas"></div>
    </div>
  </div>
</div>

<!-- Bottom sheet -->
<div id="bs" class="shut" style="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#0d0d0d;border-top:2px solid #444;border-radius:14px 14px 0 0;min-height:50px">
  <div id="bs-hdl" onclick="toggleSheet()" style="cursor:pointer">
    <div id="bs-bar"></div>
    <div id="bs-tabs">
      <div class="bst on"  id="bst-cond"   onclick="showTab('cond',event)">📡 Conditions</div>
      <div class="bst"     id="bst-sp"     onclick="showTab('sp',event)">🎯 Species</div>
      <div class="bst"     id="bst-spots"  onclick="showTab('spots',event)">📍 Spots</div>
      <div class="bst"     id="bst-lunar"  onclick="showTab('lunar',event)">🌙 Lunar</div>
    </div>
  </div>
  <div id="bs-cont">
    <!-- Conditions -->
    <div id="condpanel">
      <div id="forecast-summary" style="margin-bottom:12px;padding:10px;background:rgba(255,255,255,.04);border-radius:8px">
        <div id="go-sub" style="color:#ddd;font-size:13px;font-weight:600">Loading conditions...</div>
        <div id="go-issues" style="color:#ffaa66;font-size:11px;margin-top:4px"></div>
      </div>
      <div id="bestbet-panel" style="margin:8px 0;display:none">
        <div style="color:#e8c840;font-size:11px;font-weight:700;margin-bottom:6px;letter-spacing:.5px">🎯 BEST BETS</div>
        <div id="bestbet-list"></div>
      </div>
      <div id="buoys-list"></div>
      <div id="forecast-list"></div>
    </div>
    <!-- Species -->
    <div id="sppanel">
      <div id="spgrid"></div>
      <div id="sptip"></div>
    </div>
    <!-- Spots -->
    <div id="spotpanel">
      <div id="spotlist"><div style="color:#444;font-size:11px;padding:10px 0">Select a species to find top spots</div></div>
    </div>
    <!-- Lunar -->
    <div id="lunarpanel">
      <div id="lunarinner" style="width:100%;color:#444;font-size:11px">Loading...</div>
    </div>
  </div>
</div>

</div><!-- #app -->

<script>
'use strict';

// ── PWA Service Worker + Install Prompt ──────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  setTimeout(()=>{ if(deferredPrompt) showToast('Tip: Add DIALED to your home screen!',4000); },3000);
});

// ═══════════════════════════════════════════════════════════
// DIALED — Front End
// Fetches real data from /api/* and renders on Leaflet map
// ═══════════════════════════════════════════════════════════

// ── Load Leaflet dynamically (CDN, cached by service worker) ──────────
(function loadLeaflet(cb){
  if(window.L){ cb(); return; }
  const link=document.createElement('link');
  link.rel='stylesheet';link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);
  const s=document.createElement('script');
  s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  s.onload=cb; document.head.appendChild(s);
})(initApp);

// ── Constants ─────────────────────────────────────────────────────────
const SST_STOPS=[
  [68,[100,0,180]],[70,[60,40,255]],[72,[0,100,255]],[74,[0,190,220]],
  [75,[0,210,130]],[76,[30,210,30]],[77,[130,210,0]],[78,[210,200,0]],
  [79,[255,160,0]],[80,[255,100,0]],[81,[240,40,0]],[82,[200,0,20]],[84,[150,0,50]]
];
function sstRGB(t){
  if(t<=SST_STOPS[0][0])return SST_STOPS[0][1];
  if(t>=SST_STOPS[SST_STOPS.length-1][0])return SST_STOPS[SST_STOPS.length-1][1];
  for(let i=0;i<SST_STOPS.length-1;i++){
    const[t0,c0]=SST_STOPS[i],[t1,c1]=SST_STOPS[i+1];
    if(t>=t0&&t<=t1){const r=(t-t0)/(t1-t0);return[Math.round(c0[0]+(c1[0]-c0[0])*r),Math.round(c0[1]+(c1[1]-c0[1])*r),Math.round(c0[2]+(c1[2]-c0[2])*r)];}
  }
  return[128,128,128];
}
function sstHex(t){const[r,g,b]=sstRGB(t);return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}

const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
document.getElementById('datein').value=TODAY;
document.getElementById('datein').max=TODAY;

function toDDM(deg,isLat){
  const dir=isLat?(deg>=0?'N':'S'):(deg<=0?'W':'E');
  const d=Math.floor(Math.abs(deg));
  const m=((Math.abs(deg)-d)*60).toFixed(3);
  return `${d}° ${m}' ${dir}`;
}
function coordStr(lat,lon){return toDDM(lat,true)+'   '+toDDM(lon,false);}

function ratingLabel(v){
  if(v>0.8)return{txt:'IDEAL',cls:'bi'};
  if(v>0.55)return{txt:'GOOD',cls:'bg2'};
  if(v>0.3)return{txt:'OK',cls:'bo'};
  return{txt:'POOR',cls:'bp'};
}

// ── State ─────────────────────────────────────────────────────────────
let map=null, overlayLayers={}, waypointMarkers=[], buoyMarkers=[];
let LY={iso:1,brk:1,chl:1,bat:1,hot:1,buoys:1,grid:1};
let AF=null, currentWaypoints=[], clickedWpt=null;
let forecastDay=0;
let oceanData=null, conditionsData=null;
let sheetOpen=true, activeTab='cond';

// ── DDM coordinate helpers ────────────────────────────────────────────

// ── Named features ────────────────────────────────────────────────────
const FEATURES=[
  {name:'Palm Beach Canyon',lat:26.72,lon:-79.30},
  {name:'Cape Canaveral Edge',lat:28.55,lon:-79.55},
  {name:'Ft Pierce Inlet Edge',lat:27.46,lon:-79.45},
  {name:'Miami Blue Water',lat:25.70,lon:-79.35},
  {name:'Jupiter Ledge',lat:27.05,lon:-79.55},
  {name:'Flagler Beach Ledge',lat:29.50,lon:-80.60},
  {name:'Jacksonville 60mi',lat:30.40,lon:-79.90},
  {name:'Gulf Stream Core',lat:27.80,lon:-79.10},
];
function nearFeat(lon,lat){
  let best=null,bd=99;
  FEATURES.forEach(f=>{const d=Math.hypot(f.lon-lon,f.lat-lat);if(d<bd&&d<1.0){bd=d;best=f;}});
  return best;
}

// ── Bathymetry ─────────────────────────────────────────────────────────
// Depth contours removed per user preference

// ── MAIN INIT ─────────────────────────────────────────────────────────
function initApp(){
  // Initialize Leaflet map
  map = L.map('map', {
    center: [27.5, -79.7],
    zoom: 7,
    zoomControl: false,
    attributionControl: true,
  });

  // Esri satellite base layer (free, no API key)
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Esri World Imagery', maxZoom: 12 }
  ).addTo(map);

  // Listen for map interactions
  map.on('click', onMapClick);
  map.on('mousemove', onMapMouseMove);
  map.on('zoom', onZoom);
  // Also handle window mouseup for drag detection
  let _isDragging=false, _dragStartX=0, _dragStartY=0;
  document.getElementById('map').addEventListener('mousedown',e=>{_isDragging=false;_dragStartX=e.clientX;_dragStartY=e.clientY;});
  document.getElementById('map').addEventListener('mousemove',e=>{if(Math.hypot(e.clientX-_dragStartX,e.clientY-_dragStartY)>5)_isDragging=true;});
  document.getElementById('map').addEventListener('mouseup',e=>{
    if(!_isDragging){
      openSheet();
      showTab('cond',null);
    }
    _isDragging=false;
  });

  // Build static overlays
  buildSSTBar();
  buildBtns();
  showTab('cond', null);
  initForecastTabs();

  // Fetch data
  loadOceanData();
  loadConditions();
  loadLunarTides();

  // Refresh conditions every 30 minutes
  setInterval(loadConditions, 30 * 60 * 1000);
}

function showToast(msg, ms=2500){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), ms);
}

async function loadOceanData(date=null){
  showToast('Loading satellite data...');
  try {
    const url = date ? `/api/ocean?date=${date}&include=isotherms,breaks,chl` : '/api/ocean?include=isotherms,breaks,chl';
    const resp = await fetch(url);
    if(!resp.ok) throw new Error(`Ocean data ${resp.status}`);
    oceanData = await resp.json();
    showToast(`SST data: ${oceanData.sstDate || oceanData.date}`);
    renderOceanLayers();
    if(AF) loadWaypoints(AF.id);
  } catch(e){
    console.error('Ocean load failed:', e);
    showToast('Using model data (satellite unavailable)', 4000);
    // App still works — just without real satellite data
  }
}

async function loadConditions(){
  const el=document.getElementById('go-badge');
  el.textContent='CHECKING...';
  el.className='go-badge go-loading';
  try {
    const dayParam = forecastDay > 0 ? `&day=${forecastDay}` : '';
    const resp = await fetch(`/api/conditions?boat=medium${dayParam}`);
    if(!resp.ok) throw new Error(resp.status);
    conditionsData = await resp.json();

async function loadWaypoints(fishId){
  if(!fishId) return;
  const date = forecastDay > 0 ? getForecastDate(forecastDay) : null;
  const url = date ? `/api/waypoints?fish=${fishId}&date=${date}` : `/api/waypoints?fish=${fishId}`;
  try {
    showToast(`Finding ${fishId} spots...`);
    const resp = await fetch(url);
    if(!resp.ok) throw new Error(resp.status);
    const data = await resp.json();
    currentWaypoints = (data.waypoints || []).map(w=>{
      // Adjust score for forecast day
      if(forecastDay > 0 && conditionsData){
        // Lunar adjustment for future day
        const futureDate = new Date();
        futureDate.setDate(futureDate.getDate() + forecastDay);
        const knownNew = new Date('2024-01-11');
        const cycle = 29.53058867;
        const phase = (((futureDate - knownNew)/864e5) % cycle + cycle) % cycle / cycle;
        const lunarScore = (Math.cos(phase*2*Math.PI)+1)/2;
        // Condition penalty from forecast
        let condPenalty = 1.0;
        if(conditionsData.forecasts && conditionsData.forecasts.length > 0){
          const periods = (conditionsData.forecasts[0].periods||[]);
          const periodIdx = Math.min(forecastDay*2-1, periods.length-1);
          const p = periodIdx >= 0 ? (periods[periodIdx]?.parsed||{}) : {};
          if(p.windMax >= 25 || p.seasMax >= 6) condPenalty = 0.5;
          else if(p.windMax >= 20 || p.seasMax >= 4) condPenalty = 0.75;
          else if(p.windMax >= 15 || p.seasMax >= 3) condPenalty = 0.9;
        }
        const adjTotal = Math.min(1, w.score.total * condPenalty * (0.85 + lunarScore * 0.15));
        return {...w, score:{...w.score, total: +adjTotal.toFixed(2), forecastAdj: true}};
      }
      return w;
    }).sort((a,b)=>b.score.total-a.score.total);
    // Re-assign letters after re-sort
    const letters='ABCDEFGH';
    currentWaypoints = currentWaypoints.map((w,i)=>({...w,letter:letters[i]||w.letter}));
    buildSpotCards();
    renderWaypoints();
    showToast(`${currentWaypoints.length} spots found`);
  } catch(e){
    console.error('Waypoints failed:', e);
    showToast('Could not load waypoints', 3000);
  }
}

function renderOceanLayers(){

  clearOverlays();

  if(LY.brk && oceanData.tempBreaks) renderTempBreaks(oceanData.tempBreaks);

function clearOverlays(){
  Object.values(overlayLayers).forEach(l=>{ if(map.hasLayer(l)) map.removeLayer(l); });
  overlayLayers={};
}

function renderIsotherms(isotherms){
  const group=L.layerGroup();
  const placed={}; // track label positions per temperature
  isotherms.forEach(({T,major,segs,labels})=>{
    if(!segs||segs.length<4) return;
    const [r,g,b]=sstRGB(T);
    const color=`rgb(${r},${g},${b})`;
    // Thinner lines - minor every 1F, major every 2F
    // Group segments into chains and filter vertical artifacts
    for(let i=0;i<segs.length;i+=4){
      const lon1=segs[i],lat1=segs[i+1],lon2=segs[i+2],lat2=segs[i+3];
      const dLon=Math.abs(lon1-lon2);
      const dLat=Math.abs(lat1-lat2);
      // Skip segments that are nearly perfectly vertical (lon barely changes)
      // Real ocean fronts have significant E-W component
      if(dLon < 0.003) continue; // skip near-vertical segments
      const latlngs=[[lat1,lon1],[lat2,lon2]];
      L.polyline(latlngs,{
        color, weight:major?1.2:0.5,
        opacity:major?0.85:0.35
      }).addTo(group);
    }
    // Temperature labels on major lines only
    if(major && labels && labels.length>0){
      placed[T]=[];
      for(let i=0;i<labels.length;i+=2){
        const lat=labels[i+1], lon=labels[i];
        // Skip if too close to another label for same temp
        if(placed[T].some(p=>Math.hypot(p[0]-lat,p[1]-lon)<1.5)) continue;
        placed[T].push([lat,lon]);
        const icon=L.divIcon({
          className:'',
          html:`<div style="background:rgba(0,0,0,0.75);color:rgb(${r},${g},${b});
                font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;
                border:1px solid rgba(${r},${g},${b},0.6);white-space:nowrap;
                font-family:monospace">${T}F</div>`,
          iconSize:[32,14], iconAnchor:[16,7]
        });
        L.marker([lat,lon],{icon,interactive:false}).addTo(group);
      }
    }
  });
  group.addTo(map);
  overlayLayers.isotherms=group;
}

function renderTempBreaks(breaks){
  if(!breaks||!breaks.length) return;
  // Render as a canvas overlay for performance
  const canvas=L.canvas({padding:0.1});
  const group=L.layerGroup();
  // Sample — render as circle markers for the strongest breaks
  const strong=breaks.filter(b=>b.intensity>0.08);
  strong.forEach(b=>{
    L.circleMarker([b.lat,b.lon],{
      radius:3, color:'transparent', fillColor:'#ffee00',
      fillOpacity:0.6+b.intensity*0.3, weight:0, renderer:canvas,
    }).addTo(group);
  });
  group.addTo(map);
  overlayLayers.breaks=group;
}

function renderChlStipple(chlGrid){
  // NOAA CoastWatch East Coast VIIRS chlorophyll PNG overlay
  // Files use Julian day format: VRSUCW_YYYYDDD_DAILY_SNPP_CHLORA_FG_750M.png
  // FG region: Florida-Georgia Coast ~24-32N, 84-76W
  
  function getJulianDay(date){
    const start = new Date(date.getFullYear(), 0, 0);
    const diff = date - start;
    const oneDay = 1000*60*60*24;
    return Math.floor(diff/oneDay);
  }
  
  // Try last few days to find available data
  let loaded = false;
  for(let daysBack = 1; daysBack <= 7; daysBack++){
    const d = new Date();
    d.setDate(d.getDate() - daysBack);
    const year = d.getFullYear();
    const jday = String(getJulianDay(d)).padStart(3,'0');
    const url = 'https://eastcoast.coastwatch.noaa.gov/data/viirs/chl/daily/fg/VRSUCW_'+year+jday+'_DAILY_SNPP_CHLORA_FG_750M.png';
    
    // FG region bounds (Florida-Georgia Coast)
    const bounds = [[24.0, -84.0], [32.0, -76.0]];
    
    const overlay = L.imageOverlay(url, bounds, {
      opacity: 0.65,
      errorOverlayUrl: '',
      attribution: 'NOAA CoastWatch VIIRS Chl'
    });
    
    // Test if image loads
    const img = new Image();
    img.onload = function(){
      if(!loaded){
        loaded = true;
        overlay.addTo(map);
        overlayLayers.chl = overlay;
        console.log('Chl loaded: day', jday);
      }
    };
    img.onerror = function(){ console.log('Chl not found: day', jday); };
    img.src = url;
    
    if(!loaded && daysBack === 1){
      // Add first attempt immediately, remove if fails
      overlay.addTo(map);
      overlayLayers.chl = overlay;
    }
    break; // try one at a time
  }
}

function renderFishZone(fish, data){
  if(!data?.sstGrid||!data?.chlGrid||!data?.depthGrid) return;
  const NX=200, NY=180, GL0=-82.5, GL1=-76.5, GA0=23.5, GA1=31.8;
  const canvas=L.canvas({padding:0.1});
  const [fR,fG,fB]=[parseInt(fish.c.slice(1,3),16),parseInt(fish.c.slice(3,5),16),parseInt(fish.c.slice(5,7),16)];
  const group=L.layerGroup();
  const step=3;
  for(let iy=0;iy<NY;iy+=step) for(let ix=0;ix<NX;ix+=step){
    const dep=data.depthGrid[iy*NX+ix]; if(dep<=0) continue;
    const sst=data.sstGrid[iy*NX+ix];
    const chl=data.chlGrid[iy*NX+ix];
    if(!sst) continue;
    const sc=quickScore(fish,sst,chl,dep);
    if(sc<0.20) continue;
    const lat=GA1-iy/NY*(GA1-GA0);
    const lon=GL0+ix/NX*(GL1-GL0);
    const alpha=Math.min(0.65,((sc-0.20)/0.80)*0.65);
    L.circleMarker([lat,lon],{
      radius:4, color:'transparent',
      fillColor:`rgb(${fR},${fG},${fB})`,
      fillOpacity:alpha, weight:0, renderer:canvas,
    }).addTo(group);
  }
  group.addTo(map);
  overlayLayers.fishzone=group;
}

function quickScore(fish,sst,chl,dep){
  let ss=0,cs=0,ds=0;
  if(sst>=fish.sst[0]&&sst<=fish.sst[1]){const m=(fish.sst[0]+fish.sst[1])/2,r=(fish.sst[1]-fish.sst[0])/2;ss=1-Math.abs(sst-m)/r;}
  const cm=(fish.chl[0]+fish.chl[1])/2,cr=(fish.chl[1]-fish.chl[0])/2;
  if(cr>0)cs=Math.max(0,1-Math.abs(chl-cm)/cr);
  if(dep>=fish.dep[0]&&dep<=fish.dep[1]){const dm=(fish.dep[0]+fish.dep[1])/2,dr=(fish.dep[1]-fish.dep[0])/2;ds=dr>0?Math.max(0,1-Math.abs(dep-dm)/dr):1;}
  const w=fish.w||{sst:.33,chl:.22,dep:.33};
  return ss*w.sst+cs*w.chl+ds*w.dep;
}

}

    el.innerHTML=AF?'<div style="color:#444;font-size:11px;padding:8px 0">No spots found</div>':'<div style="color:#444;font-size:11px;padding:8px 0">Select a species above</div>';
    return;
  }
  el.innerHTML=currentWaypoints.map(w=>{
    const pct=Math.round(w.score.total*100);
    const feat=nearFeat(w.lon,w.lat);
    const sr=ratingLabel(w.score.sst),cr=ratingLabel(w.score.chl),dr=ratingLabel(w.score.dep);
    return `<div class="scard" id="sc-${w.letter}" style="--fc:${AF.c}" onclick="tapCard('${w.letter}')">
      <div class="sctop">
        <div class="scltr" style="background:${AF.c}">${w.letter}</div>
        <div><div class="scnm">${feat?feat.name:'Open Water'}</div>
        <div class="scco">${coordStr(w.lat,w.lon)}</div></div>
        <div class="scpct" style="color:${AF.c}">${pct}%</div>
      </div>
      <div class="sreas">
        <div class="srea">🌡 SST ${w.sst}°F <span class="srlt ${sr.cls}" style="margin-left:auto">${sr.txt}</span></div>
        <div class="srea">⚓ ~${w.dep.toLocaleString()}ft <span class="srlt ${dr.cls}" style="margin-left:auto">${dr.txt}</span></div>
        <div class="srea">🌿 Chl ${w.chl} <span class="srlt ${cr.cls}" style="margin-left:auto">${cr.txt}</span></div>
        ${w.gs>0.35?'<div class="srea">🌊 Gulf Stream nearby</div>':''}
      </div>
    </div>`;
  }).join('');
}

function tapCard(letter){
  const w=currentWaypoints.find(x=>x.letter===letter);if(!w)return;
  clickedWpt=(clickedWpt&&clickedWpt.letter===letter)?null:w;
  if(clickedWpt){showWpt(clickedWpt);map.setView([w.lat,w.lon],map.getZoom());}
  else closeWpt();
}

function showWpt(w){
  const el=document.getElementById('wptpop');if(!el)return;
  const pct=Math.round(w.score.total*100);
  const feat=nearFeat(w.lon,w.lat);
  const sr=ratingLabel(w.score.sst),cr=ratingLabel(w.score.chl),dr=ratingLabel(w.score.dep);
  document.getElementById('wptinner').style.borderColor=AF.c;
  document.getElementById('wptltr').style.background=AF.c;
  document.getElementById('wptltr').textContent=w.letter;
  document.getElementById('wptsp').textContent=`${AF.icon} ${AF.name} — Spot ${w.letter}`;
  document.getElementById('wptco').textContent=coordStr(w.lat,w.lon);
  document.getElementById('wptpct').style.color=AF.c;
  document.getElementById('wptpct').textContent=pct+'%';
  document.getElementById('wptreas').innerHTML=`
    <div class="wr">🌡 SST <b style="color:${sstHex(w.sst)}">${w.sst}°F</b><span class="wbdg ${sr.cls}">${sr.txt}</span></div>
    <div class="wr">⚓ Depth <b style="color:#88ccff">~${w.dep.toLocaleString()}ft</b><span class="wbdg ${dr.cls}">${dr.txt}</span></div>
    <div class="wr">🌿 Chl <b style="color:#88ff44">${w.chl} mg/m³</b><span class="wbdg ${cr.cls}">${cr.txt}</span></div>
    ${feat?`<div class="wr">📍 <b style="color:#ddd">${feat.name}</b></div>`:''}
    ${w.gs>0.35?'<div class="wr">🌊 <b style="color:#44aaff">Gulf Stream nearby</b></div>':''}`;
  el.style.display='block';
}
function closeWpt(){document.getElementById('wptpop').style.display='none';clickedWpt=null;}

// ── LUNAR ─────────────────────────────────────────────────────────────
function lunarPhase(date=new Date()){
  const known=new Date('2024-01-11T00:00:00Z'),cycle=29.53058867;
  const phase=((( (date-known)/864e5 )%cycle)+cycle)%cycle/cycle;
  const names=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
  const icons=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
  return{phase,pct:Math.round((1-Math.abs(1-phase*2))*100),name:names[Math.floor(phase*8)%8],icon:icons[Math.floor(phase*8)%8],solunar:Math.round((Math.cos(phase*2*Math.PI)+1)/2*100)};
}

function renderLunarPanel(lp){
  document.getElementById('lunarinner').innerHTML=`
    <div class="lbox">
      <div class="ltit">Lunar Phase</div>
      <div class="lbig">${lp.icon}</div>
      <div class="lval">${lp.name}</div>
      <div class="lsub">${lp.pct}% illuminated</div>
      <div class="lbar"><div class="lfill" style="width:${lp.solunar}%;background:#e8c840"></div></div>
      <div class="lsub" style="margin-top:3px">Solunar: ${lp.solunar}/100</div>
    </div>
    <div class="lbox">
      <div class="ltit">Best Bite Times</div>
      <div class="lsub" style="line-height:1.8">
        Peak feeding occurs near new and full moon. Solunar score above 80 = prime time.<br><br>
        <b style="color:${lp.solunar>75?'#44ff88':lp.solunar>50?'#ffcc00':'#ff7777'}">
        ${lp.solunar>75?'PRIME — Fish now!':lp.solunar>50?'GOOD — Above average':lp.solunar>25?'AVERAGE':'SLOW — Off peak'}
        </b>
      </div>
    </div>`;
}

// ── BOTTOM SHEET ──────────────────────────────────────────────────────

function renderBestBets(condData){
  const panel=document.getElementById('bestbet-panel');
  const list=document.getElementById('bestbet-list');
  if(!panel||!list) return;
  const TARGET=['king','wahoo','sail','bft','mahi'];
  const targetFish=FISH_CLIENT.filter(f=>TARGET.includes(f.id));
  let condScore=1.0,condNote='';
  if(condData.forecasts&&condData.forecasts.length>0){
    const periods=(condData.forecasts[0].periods)||[];
    if(periods.length>0){
      const p=periods[0].parsed||{};
      if((p.windMax>=25)||(p.seasMax>=6)){condScore=0.3;condNote='Rough seas';}
      else if((p.windMax>=20)||(p.seasMax>=4)){condScore=0.6;condNote='Moderate seas';}
      else if((p.windMax>=15)||(p.seasMax>=3)){condScore=0.8;condNote='Light chop';}
      else if(p.windMax>0){condScore=0.95;condNote='Good conditions';}
    }
  }
  if(condData.forecastDay===0&&condData.buoys&&condData.buoys.length>0){
    const b=condData.buoys[0];
    if(b.waves&&b.waves.height>=6)condScore=Math.min(condScore,0.3);
    else if(b.waves&&b.waves.height>=4)condScore=Math.min(condScore,0.6);
    if(b.wind&&b.wind.speed>=25)condScore=Math.min(condScore,0.3);
    else if(b.wind&&b.wind.speed>=20)condScore=Math.min(condScore,0.6);
  }
  if(condScore<0.25){
    panel.style.display='block';
    list.innerHTML='<div style="color:#ff6644;font-size:12px;padding:6px 0">Too rough to fish offshore safely</div>';
    return;
  }
  const bets=[];
  targetFish.forEach(fish=>{
    const waypts=AF&&AF.id===fish.id?currentWaypoints:null;
    let fishScore=0.5,bestWpt=null;
    if(waypts&&waypts.length>0){
      bestWpt=waypts[0];
      fishScore=bestWpt.score.total*condScore;
    } else {
      const buoySst=condData.buoys&&condData.buoys[0]?condData.buoys[0].sst:null;
      if(buoySst){
        const mid=(fish.sst[0]+fish.sst[1])/2,range=(fish.sst[1]-fish.sst[0])/2;
        fishScore=Math.max(0,1-Math.abs(buoySst-mid)/range)*0.55*condScore;
      }
    }
    if(fishScore>0.10)bets.push({fish,score:fishScore,bestWpt,condScore});
  });
  bets.sort((a,b)=>b.score-a.score);
  if(bets.length===0){panel.style.display='none';return;}
  panel.style.display='block';
  const condColor=condScore>=0.9?'#44ff88':condScore>=0.7?'#ffcc00':'#ff8844';
  if(!condNote)condNote=condData.forecastDay>0?['','Tomorrow','+2 Days','+3 Days','+4 Days'][condData.forecastDay]:'Today';
  list.innerHTML=bets.map((bet,i)=>{
    const pct=Math.round(bet.score*100);
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    const loc=bet.bestWpt?`<div style="color:#777;font-size:9px">${coordStr(bet.bestWpt.lat,bet.bestWpt.lon)}</div>`:'';
    return `<div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #1a1a1a;cursor:pointer" onclick="selectFishAndShow('${bet.fish.id}')">
      <span style="font-size:20px;margin-right:10px">${bet.fish.icon}</span>
      <div style="flex:1">
        <div style="color:#ddd;font-size:12px;font-weight:600">${medal} ${bet.fish.name}</div>
        ${loc}
      </div>
      <div style="text-align:right">
        <div style="color:${bet.fish.c};font-size:17px;font-weight:700">${pct}%</div>
        <div style="color:${condColor};font-size:9px">${condNote}</div>
      </div>
    </div>`;
  }).join('');
}
function selectFishAndShow(fishId){
  const fish=FISH_CLIENT.find(f=>f.id===fishId);
  if(!fish)return;
  FISH_CLIENT.forEach(f=>{const b=document.getElementById('fb-'+f.id);if(b)b.classList.remove('on');});
  const btn=document.getElementById('fb-'+fishId);
  if(btn)btn.classList.add('on');
  AF=fish;closeWpt();
  loadWaypoints(fish.id);
  showTab('spots',null);
  openSheet();
}

function toggleSheet(){
  sheetOpen=!sheetOpen;
  document.getElementById('bs').classList.toggle('shut',!sheetOpen);
}
function openSheet(){
  sheetOpen=true;
  document.getElementById('bs').classList.remove('shut');
}

function showTab(tab,e){
  if(e)e.stopPropagation();
  activeTab=tab;
  if(!sheetOpen)openSheet();
  ['cond','sp','spots','lunar'].forEach(t=>{
    document.getElementById('bst-'+t).classList.toggle('on',t===tab);
  });
  document.getElementById('condpanel').style.display=tab==='cond'?'block':'none';
  document.getElementById('sppanel').style.display=tab==='sp'?'block':'none';
  document.getElementById('spotpanel').style.display=tab==='spots'?'block':'none';
  document.getElementById('lunarpanel').style.display=tab==='lunar'?'flex':'none';
}

// ── FORECAST ─────────────────────────────────────────────────────────
function initForecastTabs(){
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for(let i=0;i<=4;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const el=document.getElementById('fd-'+i);
    if(el)el.textContent=i===0?'Today':days[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();
  }
}
function getForecastDate(offset){
  const d=new Date(); d.setDate(d.getDate()+offset);
  return d.toISOString().slice(0,10);
}
function setDay(off){
  forecastDay=off;
  for(let i=0;i<=4;i++){const t=document.getElementById('ft-'+i);if(t)t.classList.toggle('on',i===off);}
  // Update header date display
  const d=new Date(); d.setDate(d.getDate()+off);
  const label=off===0?'TODAY':'+'+off+' '+d.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'});
  const ft=document.getElementById('ft-'+off);
  // Reload ocean data (SST stays same, only conditions change for forecast)
  const date=null; // Always use latest satellite data
  loadOceanData(date);
  loadConditions(); // Reload with forecast day
  if(AF) loadWaypoints(AF.id);
}
function applyDate(){
  const ds=document.getElementById('datein').value;
  if(!ds)return;
  loadOceanData(ds);
}

// ── SST COLOR BAR ────────────────────────────────────────────────────
function buildSSTBar(){
  const canvas=document.getElementById('sst-canvas');if(!canvas)return;
  const c=canvas.getContext('2d'),grd=c.createLinearGradient(0,0,160,0);
  SST_STOPS.forEach(([t,[r,g,b]])=>grd.addColorStop(Math.max(0,Math.min(1,(t-68)/16)),`rgb(${r},${g},${b})`));
  c.fillStyle=grd;c.fillRect(0,0,160,10);
  const lbl=document.getElementById('sst-labels');
  if(lbl)lbl.innerHTML='<span>68F</span><span>74F</span><span>79F</span><span>84F</span>';
}

function sched(){if(!rafPending){rafPending=true;requestAnimationFrame(()=>{rafPending=false;});}}
